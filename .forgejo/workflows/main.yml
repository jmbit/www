name: main
on: 
  push:
    branches: [main]

jobs:
  docker:
    runs-on: node
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: git.jmbit.de
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.actions_packages }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: git.jmbit.de/jmb/www-jmbit-de:latest

