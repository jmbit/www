on: 
  push:
    branches: [main]
jobs:
  print-content:
    runs-on: docker
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: build hugo
        uses: peaceiris/actions-hugo@v3
        run: cd hugo && hugo --minify
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

